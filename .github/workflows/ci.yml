name: CI

on:
  push:
    branches: [preprod, prod, freebuff-web]
  pull_request:
    branches: [preprod, prod, freebuff-web]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test