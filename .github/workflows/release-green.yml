name: Release-Green (continuous)

on:
  push:
    branches: [preprod, prod]
  pull_request:
    branches: [preprod, prod]

permissions:
  contents: read

env:
  RELEASE_BRANCH: prod
  MAIN_BRANCH: preprod

jobs:
  validate-release-branch:
    name: Validate active release branch
    if: github.ref == 'refs/heads/prod' || github.base_ref == 'prod'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Assert the release branch is installable
        run: node -e "const p=require('./package.json'); if(!p.version) throw new Error('missing version');"

  validate-main:
    name: Validate main branch
    if: github.ref == 'refs/heads/preprod' || github.base_ref == 'preprod'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  baseline-headroom:
    name: Baseline headroom
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: changed
        name: Detect budget change
        run: |
          set -euo pipefail
          BASE="origin/${{ github.base_ref }}"
          if git diff --name-only "${BASE}...HEAD" | grep -q '^\.github/budgets/'; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          fi

      - uses: actions/setup-node@v4
        if: steps.changed.outputs.changed == 'true'
        with:
          node-version: 20
          cache: npm

      - name: Measure headroom against the recorded baseline
        if: steps.changed.outputs.changed == 'true'
        run: |
          set -euo pipefail
          npm ci
          npm run build
          node scripts/budgets.mjs check

  bank-ratchet-shrinks:
    name: Bank ratchet shrinks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: changed
        name: Detect ratchet change
        run: |
          set -euo pipefail
          BASE="origin/${{ github.base_ref }}"
          if git diff --name-only "${BASE}...HEAD" | grep -q '^\.github/budgets/ratchet.json'; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          fi

      - uses: actions/setup-node@v4
        if: steps.changed.outputs.changed == 'true'
        with:
          node-version: 20
          cache: npm

      - name: Bank every ratchet shrink
        if: steps.changed.outputs.changed == 'true'
        run: |
          set -euo pipefail
          npm ci
          npm run build
          node scripts/budgets.mjs ratchet
