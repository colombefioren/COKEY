name: CodeQL

on:
  push:
    branches: [preprod, prod, freebuff-web]
  pull_request:
    branches: [preprod, prod, freebuff-web]
  schedule:
    - cron: "27 4 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
            runner: ubuntu-latest
          - language: javascript-typescript
            build-mode: none
            runner: ubuntu-latest
          - language: python
            build-mode: none
            runner: ubuntu-latest
          - language: c-cpp
            build-mode: none
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      # Uploading SARIF requires code scanning to be enabled for the repository
      # (Settings -> Code security -> Code scanning). Until it is, the analysis
      # still runs and still reports locally, but the upload would fail, so this
      # step is allowed to fail without blocking the branch. Once code scanning
      # is on, remove `continue-on-error` to make real alerts fail the check.
      - name: Perform CodeQL analysis
        continue-on-error: true
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
