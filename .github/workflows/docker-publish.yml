name: Publish to Docker Hub and GHCR

on:
  push:
    tags: ["v*"]
    branches: [prod]
  release:
    types: [published]

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ${{ vars.DOCKERHUB_NAMESPACE || github.repository_owner }}/cokey
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/cokey

jobs:
  metadata:
    name: Resolve Docker release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tags: ${{ steps.meta.outputs.tags }}
      platforms: ${{ steps.meta.outputs.platforms }}
    steps:
      - uses: actions/checkout@v4

      - name: Derive release metadata
        id: meta
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          {
            echo "version=${VERSION}"
            echo "platforms=linux/amd64,linux/arm64"
            echo "tags<<EOF"
            if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
              printf '%s\n' "${IMAGE}:${VERSION}" "${IMAGE}:latest" "${GHCR_IMAGE}:${VERSION}" "${GHCR_IMAGE}:latest"
            elif [[ "${GITHUB_REF}" == "refs/heads/prod" ]]; then
              printf '%s\n' "${IMAGE}:nightly" "${GHCR_IMAGE}:nightly"
            else
              printf '%s\n' "${IMAGE}:${VERSION}" "${GHCR_IMAGE}:${VERSION}"
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Summarize
        run: |
          echo "Version: ${{ steps.meta.outputs.version }}"
          echo "Platforms: ${{ steps.meta.outputs.platforms }}"
          echo "Tags:"
          echo "${{ steps.meta.outputs.tags }}"

  publish:
    name: Publish multi-arch manifests
    needs: metadata
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Detect Docker Hub credentials
        id: creds
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          if [[ -n "${DOCKERHUB_USERNAME:-}" ]]; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
          else
            echo "available=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Explain how to enable publishing
        if: steps.creds.outputs.available != 'true'
        run: |
          echo "::notice::Add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets to publish images."

      - name: Set up QEMU
        if: steps.creds.outputs.available == 'true'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130

      - name: Set up Buildx
        if: steps.creds.outputs.available == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to Docker Hub
        if: steps.creds.outputs.available == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        if: steps.creds.outputs.available == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.creds.outputs.available == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          platforms: ${{ needs.metadata.outputs.platforms }}
          push: true
          tags: ${{ needs.metadata.outputs.tags }}
          labels: |
            org.opencontainers.image.title=COKEY
            org.opencontainers.image.description=Local LLM credential pool and chain-fallback gateway
            org.opencontainers.image.version=${{ needs.metadata.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
