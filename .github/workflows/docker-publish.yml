name: Publish to Docker Hub

on:
  push:
    tags: ["v*"]
    branches: [prod]
  release:
    types: [published]

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ${{ vars.DOCKERHUB_NAMESPACE || github.repository_owner }}/cokey

jobs:
  metadata:
    name: Resolve Docker release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tags: ${{ steps.meta.outputs.tags }}
      platforms: ${{ steps.meta.outputs.platforms }}
    steps:
      - uses: actions/checkout@v4

      - name: Derive release metadata
        id: meta
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          {
            echo "version=${VERSION}"
            echo "platforms=linux/amd64,linux/arm64"
            echo "tags<<EOF"
            if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
              # A tag publishes the pinned version and moves latest.
              printf '%s\n' "${IMAGE}:${VERSION}" "${IMAGE}:latest"
            elif [[ "${GITHUB_REF}" == "refs/heads/prod" ]]; then
              printf '%s\n' "${IMAGE}:nightly"
            else
              printf '%s\n' "${IMAGE}:${VERSION}"
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Summarize
        run: |
          echo "Version: ${{ steps.meta.outputs.version }}"
          echo "Platforms: ${{ steps.meta.outputs.platforms }}"

  publish:
    name: Publish multi-arch manifests
    needs: metadata
    # Image pushes only happen for real releases, never for pull requests.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # `secrets` cannot be read from an `if` expression, so the presence of
      # the credentials is detected in a step and the result is published as an
      # output that later steps can branch on.
      - name: Detect Docker Hub credentials
        id: creds
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          if [[ -n "${DOCKERHUB_USERNAME:-}" ]]; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
          else
            echo "available=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Explain how to enable publishing
        if: steps.creds.outputs.available != 'true'
        run: |
          echo "::notice::Add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets to publish images."

      - name: Set up QEMU
        if: steps.creds.outputs.available == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        if: steps.creds.outputs.available == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.creds.outputs.available == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        if: steps.creds.outputs.available == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ needs.metadata.outputs.platforms }}
          push: true
          tags: ${{ needs.metadata.outputs.tags }}
          labels: |
            org.opencontainers.image.title=COKEY
            org.opencontainers.image.description=Local LLM credential pool and chain-fallback gateway
            org.opencontainers.image.version=${{ needs.metadata.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
