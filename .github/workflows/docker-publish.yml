name: Publish to Docker Hub

on:
  push:
    tags: ["v*"]
    branches: [prod]
  release:
    types: [published]

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ${{ vars.DOCKERHUB_NAMESPACE || github.repository_owner }}/cokey

jobs:
  metadata:
    name: Resolve Docker release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tags: ${{ steps.meta.outputs.tags }}
      platforms: ${{ steps.meta.outputs.platforms }}
    steps:
      - uses: actions/checkout@v4

      - name: Derive release metadata
        id: meta
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          TAGS="${IMAGE}:${VERSION}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAGS="${TAGS}"$'\n'"${IMAGE}:latest"
          fi
          if [[ "${GITHUB_REF}" == "refs/heads/prod" ]]; then
            TAGS="${IMAGE}:nightly"
          fi

          {
            echo "version=${VERSION}"
            echo "platforms=linux/amd64,linux/arm64"
            echo "tags<<EOF"
            echo "${TAGS}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Summarize
        run: |
          echo "Version: ${{ steps.meta.outputs.version }}"
          echo "Platforms: ${{ steps.meta.outputs.platforms }}"

  publish:
    name: Publish multi-arch manifests
    needs: metadata
    # Image pushes only happen for real releases, never for pull requests.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ needs.metadata.outputs.platforms }}
          push: ${{ secrets.DOCKERHUB_USERNAME != '' }}
          tags: ${{ needs.metadata.outputs.tags }}
          labels: |
            org.opencontainers.image.title=COKEY
            org.opencontainers.image.description=Local LLM credential pool and chain-fallback gateway
            org.opencontainers.image.version=${{ needs.metadata.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
