name: Registry guard

on:
  push:
    branches: [preprod, prod]
  pull_request:
    branches: [preprod, prod]

permissions:
  contents: read

jobs:
  guard:
    name: Forbid GitHub Packages publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject workflows that publish to GitHub Packages
        run: |
          set -euo pipefail
          offenders="$(grep -RInE 'npm\.pkg\.github\.com|pkg\.github\.com|ghcr\.io' .github/workflows/ --include='*.yml' --exclude='registry-guard.yml' || true)"
          if [[ -n "${offenders}" ]]; then
            printf '%s\n' "${offenders}"
            echo "::error::Publishing to GitHub Packages is disabled. Publish to npmjs.org (@cocofioren/cokey) and Docker Hub (cocofioren/cokey)."
            exit 1
          fi