<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 980 340"
  width="980"
  height="340"
  role="img"
  aria-label="Three layers of containment: chain fallback, key cooldown and model gating"
>
  <title>Three self-healing layers</title>
  <desc>
    Layer one moves a whole chain past a node that cannot serve. Layer two cools one key
    down while its siblings keep serving. Layer three offers only the models a verified
    key can actually run.
  </desc>

  <defs>
    <pattern id="dotgrid2" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#dd5c95" opacity="0.14" />
    </pattern>
    <filter id="lift2" x="-20%" y="-60%" width="140%" height="220%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#2b1a2f" flood-opacity="0.1" />
    </filter>
    <style>
      .kicker { font: 600 10.5px/1 ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.1em; }
      .title { font: italic 22px/1 "Instrument Serif", Georgia, serif; fill: #2b1a2f; }
      .body { font: 12.5px/1.4 ui-sans-serif, system-ui, sans-serif; fill: #6d5871; }
      .num { font: italic 30px/1 "Instrument Serif", Georgia, serif; }
    </style>
  </defs>

  <rect width="980" height="340" fill="#fffaf7" />
  <rect width="980" height="340" fill="url(#dotgrid2)" />

  <!-- layer 1 -->
  <g filter="url(#lift2)">
    <rect x="20" y="18" width="940" height="88" rx="20" fill="#ffffff" />
  </g>
  <rect x="20" y="18" width="7" height="88" rx="3.5" fill="#f482b4" />
  <text x="56" y="66" text-anchor="middle" class="num" fill="#f482b4">1</text>
  <text x="96" y="46" class="kicker" fill="#dd5c95">WHOLE CHAIN</text>
  <text x="96" y="70" class="title">a node that cannot serve at all</text>
  <text x="96" y="92" class="body">handled by node fallback → the request walks on to the next node</text>
  <circle cx="895" cy="62" r="9" fill="#ffeaf4">
    <animate attributeName="opacity" values="1;0.4;1" dur="2.1s" begin="0s" repeatCount="indefinite" />
  </circle>

  <!-- layer 2 -->
  <g filter="url(#lift2)">
    <rect x="20" y="126" width="940" height="88" rx="20" fill="#ffffff" />
  </g>
  <rect x="20" y="126" width="7" height="88" rx="3.5" fill="#2f9d74" />
  <text x="56" y="174" text-anchor="middle" class="num" fill="#2f9d74">2</text>
  <text x="96" y="154" class="kicker" fill="#1f7a58">ONE KEY</text>
  <text x="96" y="178" class="title">429, invalid key, provider 5xx</text>
  <text x="96" y="200" class="body">handled by key cooldown → that key cools down, its siblings keep serving</text>
  <circle cx="895" cy="170" r="9" fill="#e2f5ec">
    <animate attributeName="opacity" values="1;0.4;1" dur="2.1s" begin="0.7s" repeatCount="indefinite" />
  </circle>

  <!-- layer 3 -->
  <g filter="url(#lift2)">
    <rect x="20" y="234" width="940" height="88" rx="20" fill="#ffffff" />
  </g>
  <rect x="20" y="234" width="7" height="88" rx="3.5" fill="#7452f0" />
  <text x="56" y="282" text-anchor="middle" class="num" fill="#7452f0">3</text>
  <text x="96" y="262" class="kicker" fill="#5b39d4">ONE MODEL</text>
  <text x="96" y="286" class="title">a model whose key isn't verified</text>
  <text x="96" y="308" class="body">handled by model gating → the model is offered only when it can run</text>
  <circle cx="895" cy="278" r="9" fill="#f1ecff">
    <animate attributeName="opacity" values="1;0.4;1" dur="2.1s" begin="1.4s" repeatCount="indefinite" />
  </circle>
</svg>
