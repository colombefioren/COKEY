<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 128" role="img" aria-label="COKEY">
  <title>COKEY</title>
  <defs>
    <linearGradient id="cokey-mark" x1="24" y1="24" x2="200" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D9A9CC" />
      <stop offset="0.55" stop-color="#C08FBF" />
      <stop offset="1" stop-color="#9672A6" />
    </linearGradient>
    <linearGradient id="cokey-word" x1="246" y1="42" x2="430" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ECD4E7" />
      <stop offset="1" stop-color="#D9A9CC" />
    </linearGradient>
  </defs>

  <!--
    One continuous line: it starts at the open terminal of the C, sweeps the
    left loop, crosses itself, closes the O, and returns to the crossing. The
    gap where the C stops short of the crossing is what makes the left glyph a
    C and the right one an O, instead of a symmetrical infinity.
  -->
  <path
    d="M84 50 C75 44 63 43 52 50 C32 62 32 90 52 102 C72 114 96 102 96 76 C96 50 120 38 140 50 C160 62 160 90 140 102 C120 114 96 102 96 76"
    fill="none"
    stroke="url(#cokey-mark)"
    stroke-width="13"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- two leaves, the "broke princess" sprout -->
  <path d="M148 46 C152 24 168 6 194 4 C192 30 172 48 148 46 Z" fill="#D9A9CC" />
  <path d="M166 56 C170 36 186 24 212 22 C206 44 188 58 166 56 Z" fill="#9672A6" />

  <!-- KEY, drawn as strokes so it stays crisp at any size -->
  <g
    fill="none"
    stroke="url(#cokey-word)"
    stroke-width="11"
    stroke-linecap="square"
    stroke-linejoin="miter"
  >
    <path d="M246 42 V112 M292 42 L250 76 L292 112" />
    <path d="M346 42 H312 V112 H346 M312 76 H338" />
    <path d="M378 42 L404 76 L430 42 M404 76 V112" />
  </g>
</svg>
