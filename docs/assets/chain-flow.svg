<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 980 380"
  width="980"
  height="380"
  role="img"
  aria-label="A request entering COKEY, exhausting every key of node one, and falling back to node two, which serves it"
>
  <title>COKEY chain fallback, live</title>
  <desc>
    A client sends one request to the alias cokey-best. All three keys of node one are in
    cooldown, so the request walks down the chain to node two, which serves it live.
  </desc>

  <defs>
    <pattern id="dotgrid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#dd5c95" opacity="0.16" />
    </pattern>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#2b1a2f" flood-opacity="0.12" />
    </filter>
    <style>
      .kicker { font: 500 10px/1 ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.09em; text-transform: uppercase; fill: #6d5871; }
      .title { font: italic 21px/1 "Instrument Serif", Georgia, serif; fill: #2b1a2f; }
      .title-sm { font: italic 17px/1 "Instrument Serif", Georgia, serif; fill: #2b1a2f; }
      .sub { font: 11.5px/1 ui-sans-serif, system-ui, sans-serif; fill: #6d5871; }
      .mono { font: 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace; fill: #2b1a2f; }
      .flag { font: 600 9.5px/1 ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.03em; }
    </style>
  </defs>

  <rect width="980" height="380" fill="#fffaf7" />
  <rect width="980" height="380" fill="url(#dotgrid)" />

  <path d="M 220 190 C 255 190, 255 190, 290 190" fill="none" stroke="#e3c6dc" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 460 190 C 520 190, 520 100, 600 100" fill="none" stroke="#e3c6dc" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 7" opacity="0.5" />
  <path d="M 460 190 C 520 190, 520 280, 600 280" fill="none" stroke="#2f9d74" stroke-width="3" stroke-linecap="round" stroke-dasharray="9 9">
    <animate attributeName="stroke-dashoffset" from="0" to="-36" dur="1.1s" repeatCount="indefinite" />
  </path>

  <g filter="url(#lift)">
    <rect x="0" y="141" width="220" height="98" rx="20" fill="#ffffff" />
  </g>
  <rect x="26" y="133" width="52" height="18" rx="2" fill="#f482b4" opacity="0.24" transform="rotate(-3 52 142)" />
  <text x="22" y="168" class="kicker">client</text>
  <text x="22" y="192" class="title-sm">your editor</text>
  <text x="22" y="212" class="sub">one base URL</text>

  <circle cx="375" cy="190" r="85" fill="#f482b4" />
  <text x="375" y="184" text-anchor="middle" class="kicker" fill="#ffffff" opacity="0.85">alias</text>
  <text x="375" y="206" text-anchor="middle" class="mono" fill="#ffffff">cokey-best</text>

  <g filter="url(#lift)">
    <rect x="600" y="52" width="270" height="96" rx="20" fill="#ffffff" opacity="0.88" />
  </g>
  <circle cx="622" cy="76" r="10" fill="#ffeaf4" />
  <text x="622" y="80" text-anchor="middle" class="flag" fill="#dd5c95">1</text>
  <text x="640" y="80" class="title-sm">groq / qwen3.8-27b</text>
  <rect x="810" y="64" width="52" height="20" rx="10" fill="#fde8e7" />
  <text x="836" y="78" text-anchor="middle" class="flag" fill="#c9424a">SKIPPED</text>
  <text x="622" y="102" class="sub">groq</text>
  <circle cx="622" cy="122" r="7" fill="#e2565a" />
  <circle cx="640" cy="122" r="7" fill="#e2565a" />
  <circle cx="658" cy="122" r="7" fill="#e2565a" />
  <text x="674" y="126" class="sub">3 keys, all cooling down</text>

  <g filter="url(#lift)">
    <rect x="600" y="232" width="270" height="96" rx="20" fill="#ffffff" />
  </g>
  <circle cx="622" cy="256" r="10" fill="#e2f5ec" />
  <text x="622" y="260" text-anchor="middle" class="flag" fill="#2f9d74">2</text>
  <text x="640" y="260" class="title-sm">openrouter / glm-5</text>
  <rect x="792" y="244" width="70" height="20" rx="10" fill="#e2f5ec">
    <animate attributeName="opacity" values="1;0.55;1" dur="1.6s" repeatCount="indefinite" />
  </rect>
  <text x="827" y="258" text-anchor="middle" class="flag" fill="#1f7a58">SERVING</text>
  <text x="622" y="282" class="sub">openrouter</text>
  <circle cx="622" cy="302" r="7" fill="#2f9d74" />
  <circle cx="622" cy="302" r="11" fill="none" stroke="#2f9d74" stroke-width="2" opacity="0.6">
    <animate attributeName="r" values="8;14;8" dur="1.6s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.7;0;0.7" dur="1.6s" repeatCount="indefinite" />
  </circle>
  <text x="638" y="306" class="sub">1 key, answering now</text>
</svg>
