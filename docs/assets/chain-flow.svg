<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 980 380"
  width="980"
  height="380"
  role="img"
  aria-label="A request entering COKEY, spending every key of node one, and falling back to node two"
>
  <title>COKEY chain fallback</title>
  <desc>
    A client sends one request to the alias cokey-best. All three keys of node one go
    into cooldown, so the request walks down the chain to node two, which serves it.
  </desc>

  <defs>
    <radialGradient id="bloom" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8D7AE0" stop-opacity="0.42" />
      <stop offset="1" stop-color="#8D7AE0" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EFB4E0" />
      <stop offset="0.55" stop-color="#CDB0F0" />
      <stop offset="1" stop-color="#8D7AE0" />
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8D7AE0" stop-opacity="0.1" />
      <stop offset="0.45" stop-color="#CDB0F0" stop-opacity="0.6" />
      <stop offset="1" stop-color="#8D7AE0" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E1858" />
      <stop offset="1" stop-color="#150F3D" />
    </linearGradient>
    <style>
      .kicker {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 9.5px;
        letter-spacing: 2.4px;
        fill: #8b84c9;
      }
      .model {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12.5px;
        fill: #f1eefc;
      }
      .body {
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-size: 13.5px;
        fill: #f1eefc;
      }
      .soft {
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-size: 11px;
        fill: #b4aee6;
      }
      .tiny {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 10px;
        fill: #8b84c9;
      }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="979" height="379" rx="20" fill="#0A0620" stroke="#2C2570" />

  <!-- the router's bloom -->
  <circle cx="407" cy="190" r="150" fill="url(#bloom)">
    <animate attributeName="opacity" values="0.55;0.95;0.55" dur="6s" repeatCount="indefinite" />
  </circle>

  <!-- ---- client ---------------------------------------------------------- -->
  <rect x="36" y="152" width="176" height="76" rx="14" fill="url(#card)" stroke="#2C2570" />
  <text class="kicker" x="56" y="180">CLIENT</text>
  <text class="body" x="56" y="203">your editor / CLI</text>
  <text class="tiny" x="56" y="220">one base URL</text>

  <!-- ---- router ---------------------------------------------------------- -->
  <rect x="300" y="118" width="214" height="144" rx="18" fill="#1E1858" stroke="#8D7AE0" />
  <g transform="translate(376 132) scale(0.19)">
    <path
      d="M96 52 C96 26 72 14 52 26 C32 38 32 66 52 78 C72 90 96 78 96 52 C96 26 120 14 140 26 C160 38 160 66 140 78 C120 90 96 78 96 52"
      fill="none"
      stroke="url(#mark)"
      stroke-width="13"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path d="M150 27 C150 8 168 0 191 2 C189 23 170 35 150 27 Z" fill="#CDB0F0" />
    <path d="M161 35 C169 18 187 12 205 15 C197 33 179 43 161 35 Z" fill="#8D7AE0" />
  </g>
  <text x="407" y="192" text-anchor="middle" fill="#F1EEFC" font-family="ui-monospace, Menlo, monospace" font-size="17" letter-spacing="7">COKEY</text>
  <text class="tiny" x="407" y="214" text-anchor="middle">alias: cokey-best</text>
  <text class="tiny" x="407" y="234" text-anchor="middle" fill="#6F68A8">key first, node second</text>

  <!-- ---- connectors ------------------------------------------------------ -->
  <line x1="212" y1="190" x2="300" y2="190" stroke="url(#rail)" stroke-width="2" />
  <path d="M514 190 H560 V88 H612" fill="none" stroke="#2C2570" stroke-width="2" />
  <path d="M560 88 V292" fill="none" stroke="#2C2570" stroke-width="2" />
  <path d="M560 190 H612" fill="none" stroke="#2C2570" stroke-width="2" />
  <path d="M560 292 H612" fill="none" stroke="#2C2570" stroke-width="2" />

  <!-- ---- node 1: every key spent ---------------------------------------- -->
  <rect x="612" y="44" width="332" height="88" rx="14" fill="url(#card)" stroke="#2C2570" stroke-width="1.4">
    <animate
      attributeName="stroke"
      dur="6s"
      repeatCount="indefinite"
      values="#2C2570;#2C2570;#F6C46E;#F6C46E;#2C2570;#2C2570"
      keyTimes="0;0.33;0.5;0.9;0.94;1"
    />
  </rect>
  <text class="kicker" x="632" y="70">NODE 1 · PRIORITY 1</text>
  <text class="model" x="632" y="92">groq / qwen3.8-27b</text>
  <text class="tiny" x="632" y="114" fill="#F6C46E" opacity="0">
    3 keys spent, cooling down
    <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.48;0.54;0.9;0.95;1" />
  </text>

  <g>
    <circle cx="872" cy="92" r="5.5" fill="#86E6B0">
      <animate attributeName="fill" dur="6s" repeatCount="indefinite" values="#86E6B0;#F6C46E;#F6C46E;#86E6B0" keyTimes="0;0.38;0.94;1" />
    </circle>
    <circle cx="894" cy="92" r="5.5" fill="#86E6B0">
      <animate attributeName="fill" dur="6s" repeatCount="indefinite" values="#86E6B0;#F6C46E;#F6C46E;#86E6B0" keyTimes="0;0.42;0.94;1" />
    </circle>
    <circle cx="916" cy="92" r="5.5" fill="#86E6B0">
      <animate attributeName="fill" dur="6s" repeatCount="indefinite" values="#86E6B0;#F6C46E;#F6C46E;#86E6B0" keyTimes="0;0.46;0.94;1" />
    </circle>
  </g>

  <!-- ---- node 2: the fallback that serves ------------------------------- -->
  <rect x="612" y="146" width="332" height="88" rx="14" fill="url(#card)" stroke="#2C2570" stroke-width="1.4">
    <animate
      attributeName="stroke"
      dur="6s"
      repeatCount="indefinite"
      values="#2C2570;#2C2570;#86E6B0;#86E6B0;#2C2570"
      keyTimes="0;0.82;0.9;0.96;1"
    />
  </rect>
  <text class="kicker" x="632" y="172">NODE 2 · PRIORITY 2</text>
  <text class="model" x="632" y="194">openrouter / deepseek-v4:free</text>
  <text class="tiny" x="632" y="216" fill="#86E6B0" opacity="0">
    fallback · serving
    <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.86;0.92;0.97;1" />
  </text>
  <circle cx="894" cy="194" r="5.5" fill="#86E6B0" />
  <circle cx="916" cy="194" r="5.5" fill="#86E6B0" />

  <!-- ---- node 3: never reached ------------------------------------------ -->
  <g opacity="0.55">
    <rect x="612" y="248" width="332" height="88" rx="14" fill="url(#card)" stroke="#2C2570" />
    <text class="kicker" x="632" y="274">NODE 3 · PRIORITY 3</text>
    <text class="model" x="632" y="296">cloudflare / gpt-oss-120b</text>
    <text class="tiny" x="632" y="318">never reached this request</text>
    <circle cx="916" cy="296" r="5.5" fill="#86E6B0" />
  </g>

  <!-- ---- the travelling request ----------------------------------------- -->
  <circle r="4.5" fill="#CDB0F0">
    <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.04;0.1;0.26;0.3;1" />
    <animateMotion
      dur="6s"
      repeatCount="indefinite"
      calcMode="linear"
      keyPoints="0;0;1;1"
      keyTimes="0;0.04;0.3;1"
      path="M216 190 H300"
    />
  </circle>

  <circle r="4.5" fill="#CDB0F0">
    <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.32;0.38;0.6;0.64;1" />
    <animateMotion
      dur="6s"
      repeatCount="indefinite"
      calcMode="linear"
      keyPoints="0;0;1;1"
      keyTimes="0;0.32;0.6;1"
      path="M518 190 H560 V88 H612"
    />
  </circle>

  <circle r="4.5" fill="#86E6B0">
    <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.66;0.72;0.94;0.98;1" />
    <animateMotion
      dur="6s"
      repeatCount="indefinite"
      calcMode="linear"
      keyPoints="0;0;1;1"
      keyTimes="0;0.66;0.94;1"
      path="M560 88 V190 H612"
    />
  </circle>

  <!-- ---- caption -------------------------------------------------------- -->
  <text class="tiny" x="36" y="352" fill="#6F68A8">
    keys rotate first · the node only falls through once every key above it is spent
  </text>
</svg>
